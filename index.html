<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>獨角獸卡牌心靈抽卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            color: #f8fafc;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body class="flex flex-col justify-between">

    <header class="w-full py-2 px-3 sm:px-4 flex justify-between items-center bg-black/30 backdrop-blur-md border-b border-white/10 shrink-0 shadow-md z-40">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-sm sm:text-base animate-pulse"></i>
            <h1 class="text-xs sm:text-base font-bold tracking-wider text-amber-100 font-serif">獨角獸心靈抽卡</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openGallery()" class="px-2.5 py-1 bg-white/10 hover:bg-white/20 text-xs font-medium rounded-full border border-white/20 transition-all flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-th-large text-amber-300"></i>
                <span id="counter-badge">44 / 44</span>
            </button>
            <button onclick="confirmReset()" class="p-1.5 bg-white/10 hover:bg-white/20 text-xs rounded-full border border-white/20 transition-all text-amber-200" title="重新洗牌">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-between px-3 py-1.5 max-w-md mx-auto w-full relative overflow-hidden">
        
        <div id="status-message" class="text-center text-indigo-200 text-xs tracking-wide bg-white/5 px-3 py-1 rounded-full border border-white/10 backdrop-blur-sm shadow-inner shrink-0">
            請保持內心平靜，點擊牌背抽取今日指引
        </div>

        <!-- Card Container with 3D Flip Effect (compact height for mobile fit) -->
        <div class="w-56 sm:w-72 h-[290px] sm:h-[370px] relative perspective-1000 cursor-pointer shrink-0 my-0.5" id="card-deck-container" onclick="drawCard()">
            <div id="card-inner" class="w-full h-full relative transform-style-3d transition-transform duration-700 shadow-2xl rounded-2xl">
                
                <!-- Card Back (Default state) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rounded-2xl border-2 border-amber-300/40 bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-900 flex flex-col items-center justify-center p-3 shadow-2xl overflow-hidden group">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent opacity-60"></div>
                    <div class="absolute inset-2 border border-amber-400/20 rounded-xl pointer-events-none"></div>
                    <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-amber-400/10 flex items-center justify-center mb-2 sm:mb-3 border border-amber-300/30 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_15px_rgba(251,191,36,0.3)]">
                        <i class="fa-solid fa-horse text-2xl sm:text-3xl text-amber-300"></i>
                    </div>
                    <h3 class="text-amber-200 font-serif tracking-widest text-sm sm:text-base mb-1 font-semibold">UNICORN CARDS</h3>
                    <p class="text-[11px] text-indigo-300 tracking-wider">點擊抽取獨角獸指引</p>
                    <div class="mt-3 px-3 py-1 bg-amber-400/20 text-amber-200 text-xs rounded-full border border-amber-300/30 animate-bounce">
                        輕觸抽卡 ✨
                    </div>
                </div>

                <!-- Card Front (Revealed state) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-2xl border-2 border-amber-400/60 bg-slate-950 flex flex-col overflow-hidden shadow-2xl">
                    <!-- Image container taking upper part -->
                    <div class="relative flex-1 bg-black/60 overflow-hidden flex items-center justify-center min-h-0">
                        <img id="card-image" src="" alt="Card Image" class="w-full h-full object-contain bg-black/85 cursor-pointer" onclick="event.stopPropagation(); showLargeImage(currentCard)" onerror="window.handleImageError(this)">
                        
                        <!-- Fallback container if image fails -->
                        <div id="card-fallback" class="absolute inset-0 hidden flex flex-col items-center justify-center p-3 bg-gradient-to-br from-indigo-950 to-slate-900 text-center">
                            <i class="fa-solid fa-horse-head text-3xl text-amber-300 mb-1 opacity-80"></i>
                            <span id="fallback-card-num" class="text-amber-400 font-mono text-[11px] mb-0.5">#01</span>
                            <h4 id="fallback-card-name" class="text-amber-200 font-serif font-bold text-xs mb-0.5">卡牌名稱</h4>
                            <p id="fallback-card-desc" class="text-indigo-200 text-[10px] italic whitespace-pre-line">指引說明</p>
                        </div>

                        <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-md px-2 py-0.5 rounded-full text-[11px] font-mono text-amber-300 border border-amber-400/30 shadow pointer-events-none" id="card-number-badge">
                            #01
                        </div>
                        <div class="absolute bottom-2 right-2 bg-black/70 backdrop-blur-md p-1.5 rounded-full text-amber-300 border border-amber-400/30 text-xs shadow hover:bg-amber-500/20 transition-all cursor-pointer" onclick="event.stopPropagation(); showLargeImage(currentCard)" title="放大檢視">
                            <i class="fa-solid fa-expand"></i>
                        </div>
                    </div>

                    <!-- Text container optimized for complete visibility without scrolling -->
                    <div class="px-3 py-1.5 bg-indigo-950 border-t border-white/10 text-center shrink-0 h-[72px] sm:h-[80px] flex flex-col justify-center">
                        <h2 id="card-title" class="text-amber-200 font-serif font-bold text-xs sm:text-sm mb-0.5 leading-snug">卡牌名稱</h2>
                        <p id="card-desc" class="text-indigo-200 text-[10px] sm:text-[11px] italic whitespace-pre-line leading-tight">卡牌短句或指引說明</p>
                    </div>
                </div>

            </div>
        </div>

        <div class="flex space-x-3 w-full max-w-xs shrink-0 my-1">
            <button onclick="drawCard()" id="draw-btn" class="flex-1 py-2 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2 active:scale-95 text-xs sm:text-sm">
                <i class="fa-solid fa-hand-sparkles"></i>
                <span>抽取卡片</span>
            </button>
            <button onclick="openGallery()" class="py-2 px-3.5 bg-white/10 hover:bg-white/20 text-indigo-100 font-medium rounded-xl border border-white/20 transition-all flex items-center justify-center space-x-1 active:scale-95 text-xs sm:text-sm">
                <i class="fa-solid fa-images text-amber-300"></i>
                <span>牌庫</span>
            </button>
        </div>

    </main>

    <div id="gallery-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col transition-opacity duration-300">
        <div class="p-3.5 flex justify-between items-center border-b border-white/10 bg-black/50 shrink-0">
            <div>
                <h2 class="text-sm sm:text-base font-serif font-bold text-amber-200">全部 44 張獨角獸卡牌</h2>
                <p class="text-[11px] text-indigo-300">已抽過: <span id="drawn-count">0</span> / 44 (點擊卡片可看彩色大圖)</p>
            </div>
            <button onclick="closeGallery()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-3">
            <div id="card-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 max-w-2xl mx-auto">
                <!-- Dynamically populated card items -->
            </div>
        </div>
        <div class="p-2.5 bg-black/50 border-t border-white/10 flex justify-center shrink-0">
            <button onclick="closeGallery()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium shadow-lg transition-all">
                返回抽卡
            </button>
        </div>
    </div>

    <!-- Zoom Modal -->
    <div id="zoom-modal" class="fixed inset-0 bg-black/90 backdrop-blur-lg z-50 hidden flex flex-col items-center justify-center p-3" onclick="closeZoomModal()">
        <div class="relative max-w-lg w-full max-h-[85vh] flex flex-col items-center" onclick="event.stopPropagation()">
            <button onclick="closeZoomModal()" class="absolute -top-10 right-0 w-9 h-9 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center transition-all text-lg shadow-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="zoom-img" src="" alt="Large Card View" class="max-h-[60vh] w-auto object-contain rounded-xl shadow-2xl border-2 border-amber-400/50 mb-2.5" onerror="window.handleImageError(this)">
            <div class="bg-indigo-950/95 border border-amber-400/30 p-3 rounded-xl text-center w-full shadow-xl">
                <h3 id="zoom-title" class="text-amber-200 font-serif font-bold text-sm sm:text-base mb-0.5">卡牌名稱</h3>
                <p id="zoom-desc" class="text-indigo-200 text-xs italic whitespace-pre-line leading-relaxed">卡牌描述</p>
            </div>
        </div>
    </div>

    <!-- Custom Alert/Confirm Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-indigo-950 border border-amber-400/40 rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl">
            <div class="w-10 h-10 rounded-full bg-amber-400/20 text-amber-300 flex items-center justify-center mx-auto mb-3 border border-amber-300/30 text-base">
                <i id="modal-icon" class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="text-base font-serif font-bold text-amber-200 mb-1.5">提示</h3>
            <p id="modal-message" class="text-xs sm:text-sm text-indigo-200 mb-5 leading-relaxed">訊息內容</p>
            <div id="modal-actions" class="flex space-x-3 justify-center">
                <button onclick="closeCustomModal()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition-all">確定</button>
            </div>
        </div>
    </div>

    <script>
        const totalCards = 44;
        let cards = [];
        let drawnCards = [];
        let currentCard = null;
        let isFlipped = false;
        let isAnimating = false;

        // Ensure global scope for image error handling
        window.handleImageError = function(imgEl) {
            imgEl.style.display = 'none';
            const fallbackEl = imgEl.parentElement.querySelector('#card-fallback') || document.getElementById('card-fallback');
            if (fallbackEl) {
                fallbackEl.classList.remove('hidden');
            }
        };

        // Initialize 44 cards dataset with exact metadata and exact filenames (獨角獸1.jpg ...)
        function initCards() {
            cards = [];
            const cardDataMap = {
                1: { name: "你的個人獨角獸", desc: "沐浴在純淨的愛之中。\n保持開放，迎接獨角獸魔法。" },
                2: { name: "純淨的意圖", desc: "找到清明。\n放棄你的小我。" },
                3: { name: "創造你的願景", desc: "做會讓你的心歌唱之事。\n你被輕推著向前行。" },
                4: { name: "解開關係的羈絆", desc: "現在就放下。\n寬恕就是自由。" },
                5: { name: "新的契機", desc: "清理你的人生。\n瞥見一扇魔法之門。" },
                6: { name: "進入魔法", desc: "活在現在。\n抓住當下。" },
                7: { name: "聆聽你的心", desc: "喚醒心靈能力。\n調頻進入無限。" },
                8: { name: "樂於接受豐盛", desc: "相信你值得。\n接受豐富與繁榮。" },
                9: { name: "敞開你的心", desc: "愛自己。\n敢於脆弱易感。" },
                10: { name: "取用你的天賦", desc: "探索你的寶箱。\n接納你的真實本性。" },
                11: { name: "尋找徵兆", desc: "好好注意。\n期待答案。" },
                12: { name: "真理的自由", desc: "誠實地溝通。\n做真正的自己。" },
                13: { name: "創意性的解決方案", desc: "打破常規思考。\n從更高的視角看待事物。" },
                14: { name: "靠自己的力量站穩", desc: "對你的願景滿懷熱情。\n帶來正向的改變。" },
                15: { name: "宇宙彩虹", desc: "尋找那罐金子。\n接受喜悅。" },
                16: { name: "靈魂療癒", desc: "與你的本質連成一氣。\n看見你的真實色彩。" },
                17: { name: "順流而行", desc: "放鬆並信任。\n接受正在發生事。" },
                18: { name: "令人煥然一新的綠洲", desc: "滋養你自己。\n累積力氣。" },
                19: { name: "白光之繭", desc: "在完美的愛中休息。\n了解「一」。" },
                20: { name: "玫瑰金宇宙池", desc: "沐浴在宇宙的愛之中。\n好好吸收智慧。" },
                21: { name: "魔法水晶洞穴", desc: "開啟你的內在之光。\n展現你的天賦。" },
                22: { name: "顯化你的夢想", desc: "聚焦在你的願景。\n尋求滿意和知足感。" },
                23: { name: "靈魂的滿足", desc: "向你的獨一無二致敬。\n做讓你感覺美好的事。" },
                24: { name: "大量的祝福", desc: "敞開自己，好好接收。\n將它傳出去。" },
                25: { name: "充滿關愛的社群", desc: "參與且成為其中的一分子。\n豐富你的人生。" },
                26: { name: "紫色火焰", desc: "祈請宇宙鑽石紫色火焰。\n轉變不是愛的一切。" },
                27: { name: "揚昇火焰", desc: "與光融合。\n點燃密鑰與密碼。" },
                28: { name: "基督之光池", desc: "敞開你的心。\n散播無條件的愛。" },
                29: { name: "聖雄能量", desc: "建立你的光體。\n使你的揚昇加速。" },
                30: { name: "宇宙鑽石", desc: "散播希望和喜悅。\n照亮世界。" },
                31: { name: "宇宙祖母綠", desc: "創造完美的健康。\n取用神性豐盛。" },
                32: { name: "宇宙紅寶石", desc: "成為和平大使。\n實踐宇宙級的精通。" },
                33: { name: "宇宙藍寶石", desc: "以榮譽和誠信行動。\n說出你的真理。" },
                34: { name: "宇宙珍珠", desc: "擴展你的心靈天賦。\n打開通往天使世界的大門。" },
                35: { name: "神性潛能", desc: "履行你的天命。\n成為你所能成的一切。" },
                36: { name: "成為指路明燈", desc: "啟發他人。\n為他人照亮道路。" },
                37: { name: "靈性戰士", desc: "向他人展現你是個睿智的領袖。\n指揮宇宙。" },
                38: { name: "獨角獸能量之門", desc: "集中你的光。\n仔細聆聽訊息。" },
                39: { name: "揚昇電梯", desc: "為快速的靈性成長做好準備。\n準備好迎接種種機會。" },
                40: { name: "天琴座星際之門", desc: "擴展你的業力輪。\n進入獨角獸王國。" },
                41: { name: "恩典法則", desc: "成為你的神性本質。\n在恩典中消融一切。" },
                42: { name: "合而為「一」", desc: "尋找共同的人性。\n祈請列木里亞之光。" },
                43: { name: "覺醒", desc: "從更高的視角觀看。\n看見每一個人內在的神性。" },
                44: { name: "我是臨在", desc: "擴展你的星系門戶。\n如我所是。" }
            };

            for (let i = 1; i <= totalCards; i++) {
                let name = cardDataMap[i] ? cardDataMap[i].name : `獨角獸卡 #${i}`;
                let desc = cardDataMap[i] ? cardDataMap[i].desc : `探索內在力量與靈性指引`;
                let imgPath = `獨角獸${i}.jpg`; // Filename format: 獨角獸1.jpg, 獨角獸2.jpg... 獨角獸44.jpg

                cards.push({
                    id: i,
                    name: name,
                    desc: desc,
                    image: imgPath
                });
            }
        }

        function loadState() {
            const savedDrawn = localStorage.getItem('unicorn_drawn_cards_v9');
            if (savedDrawn) {
                try {
                    drawnCards = JSON.parse(savedDrawn);
                } catch(e) {
                    drawnCards = [];
                }
            }
            updateCounterBadge();
        }

        function saveState() {
            localStorage.setItem('unicorn_drawn_cards_v9', JSON.stringify(drawnCards));
            updateCounterBadge();
        }

        function updateCounterBadge() {
            const remaining = totalCards - drawnCards.length;
            const badge = document.getElementById('counter-badge');
            if (badge) {
                badge.innerText = `${remaining} / ${totalCards}`;
            }
        }

        function showCustomModal(title, message, iconClass = "fa-circle-exclamation", callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').className = `fa-solid ${iconClass}`;
            
            const actionsDiv = document.getElementById('modal-actions');
            if (callback) {
                actionsDiv.innerHTML = `
                    <button onclick="closeCustomModal()" class="flex-1 py-2 bg-white/10 hover:bg-white/25 text-white rounded-xl text-xs font-medium transition-all">取消</button>
                    <button id="modal-confirm-btn" class="flex-1 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs transition-all">確定</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    closeCustomModal();
                    callback();
                };
            } else {
                actionsDiv.innerHTML = `<button onclick="closeCustomModal()" class="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium transition-all">確定</button>`;
            }
            
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        window.drawCard = function() {
            if (isAnimating) return;

            if (drawnCards.length >= totalCards) {
                showCustomModal("牌局已滿", "44 張獨角獸卡牌已經全部抽完囉！請點擊重新洗牌開始新的一局。", "fa-rotate-right", resetDeck);
                return;
            }

            const availableCards = cards.filter(c => !drawnCards.includes(c.id));
            if (availableCards.length === 0) return;

            const randomIndex = Math.floor(Math.random() * availableCards.length);
            const selectedCard = availableCards[randomIndex];
            currentCard = selectedCard;

            isAnimating = true;
            const cardInner = document.getElementById('card-inner');

            if (isFlipped) {
                cardInner.style.transform = 'rotateY(0deg)';
                isFlipped = false;
                setTimeout(() => {
                    setupCardFace(selectedCard);
                    flipCardShow(cardInner);
                }, 350);
            } else {
                setupCardFace(selectedCard);
                flipCardShow(cardInner);
            }

            drawnCards.push(selectedCard.id);
            saveState();
        };

        function setupCardFace(card) {
            const imgEl = document.getElementById('card-image');
            const fallbackEl = document.getElementById('card-fallback');
            
            imgEl.style.display = 'block';
            fallbackEl.classList.add('hidden');
            
            imgEl.src = card.image;
            document.getElementById('card-number-badge').innerText = `#${card.id}`;
            document.getElementById('card-title').innerText = card.name;
            document.getElementById('card-desc').innerText = card.desc;
            
            document.getElementById('fallback-card-num').innerText = `#${card.id}`;
            document.getElementById('fallback-card-name').innerText = card.name;
            document.getElementById('fallback-card-desc').innerText = card.desc;

            document.getElementById('status-message').innerText = `✨ 你抽到了第 ${card.id} 張卡牌：${card.name}`;
        }

        function flipCardShow(cardInner) {
            setTimeout(() => {
                cardInner.style.transform = 'rotateY(180deg)';
                isFlipped = true;
                isAnimating = false;
            }, 50);
        }

        window.confirmReset = function() {
            showCustomModal("重新洗牌", "確定要將所有已抽出的卡牌收回牌庫並重新洗牌嗎？", "fa-rotate", resetDeck);
        };

        function resetDeck() {
            drawnCards = [];
            saveState();
            
            const cardInner = document.getElementById('card-inner');
            cardInner.style.transform = 'rotateY(0deg)';
            isFlipped = false;
            document.getElementById('status-message').innerText = "已重新洗牌，請點擊牌背抽取今日指引";
        }

        window.openGallery = function() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            let drawnCount = drawnCards.length;
            document.getElementById('drawn-count').innerText = drawnCount;

            cards.forEach(card => {
                const isDrawn = drawnCards.includes(card.id);
                const cardEl = document.createElement('div');
                cardEl.className = `relative rounded-xl overflow-hidden border transition-all aspect-[2/3] flex flex-col items-center justify-between p-2 text-center shadow cursor-pointer hover:scale-105 bg-indigo-900/90 border-amber-400 shadow-[0_0_12px_rgba(251,191,36,0.35)]`;
                
                cardEl.onclick = () => showLargeImage(card);

                cardEl.innerHTML = `
                    <div class="absolute top-1 left-1 bg-black/70 px-1.5 py-0.5 rounded text-[10px] font-mono text-amber-300 z-10">#${card.id}</div>
                    <div class="w-full flex-1 mb-1 rounded overflow-hidden bg-black/50 flex items-center justify-center relative">
                        <img src="${card.image}" class="w-full h-full object-cover" onerror="this.style.display='none'">
                    </div>
                    <div class="w-full shrink-0">
                        <span class="text-[11px] font-medium text-amber-100 truncate block w-full">${card.name}</span>
                        <span class="text-[9px] ${isDrawn ? 'text-amber-300 font-semibold' : 'text-indigo-300'}">${isDrawn ? '✓ 已抽過' : '未抽'}</span>
                    </div>
                `;
                grid.appendChild(cardEl);
            });

            document.getElementById('gallery-modal').classList.remove('hidden');
        };

        window.closeGallery = function() {
            document.getElementById('gallery-modal').classList.add('hidden');
        };

        window.showLargeImage = function(card) {
            if (!card) return;
            document.getElementById('zoom-img').src = card.image;
            document.getElementById('zoom-title').innerText = `${card.id}. ${card.name}`;
            document.getElementById('zoom-desc').innerText = card.desc;
            document.getElementById('zoom-modal').classList.remove('hidden');
        };

        window.closeZoomModal = function() {
            document.getElementById('zoom-modal').classList.add('hidden');
        };

        window.onload = function() {
            initCards();
            loadState();
        };
    </script>
</body>
</html>
