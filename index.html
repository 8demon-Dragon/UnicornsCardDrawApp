<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>獨角獸卡牌心靈抽卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', 'Noto Serif TC', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            color: #f8fafc;
            min-height: 100vh;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="w-full py-4 px-6 flex justify-between items-center bg-black/30 backdrop-blur-md border-b border-white/10 sticky top-0 z-50 shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-300 text-xl animate-pulse"></i>
            <h1 class="text-base sm:text-lg font-bold tracking-wider text-amber-100 font-serif">獨角獸心靈抽卡</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openGallery()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-xs font-medium rounded-full border border-white/20 transition-all flex items-center space-x-1 shadow-sm">
                <i class="fa-solid fa-th-large text-amber-300"></i>
                <span id="counter-badge">44 / 44</span>
            </button>
            <button onclick="confirmReset()" class="p-2 bg-white/10 hover:bg-white/20 text-xs rounded-full border border-white/20 transition-all text-amber-200" title="重新洗牌">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-md mx-auto w-full relative">
        
        <div id="status-message" class="text-center mb-6 text-indigo-200 text-sm tracking-wide bg-white/5 px-4 py-1.5 rounded-full border border-white/10 backdrop-blur-sm shadow-inner">
            請保持內心平靜，點擊牌背抽取今日指引
        </div>

        <!-- Card Container with 3D Flip Effect -->
        <div class="w-72 sm:w-80 h-[450px] sm:h-[500px] relative perspective-1000 mb-8 cursor-pointer" id="card-deck-container" onclick="drawCard()">
            <div id="card-inner" class="w-full h-full relative transform-style-3d transition-transform duration-700 shadow-2xl rounded-2xl">
                
                <!-- Card Back (Default state) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rounded-2xl border-2 border-amber-300/40 bg-gradient-to-br from-indigo-950 via-purple-900 to-indigo-900 flex flex-col items-center justify-center p-6 shadow-2xl overflow-hidden group">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent opacity-60"></div>
                    <div class="absolute inset-3 border border-amber-400/20 rounded-xl pointer-events-none"></div>
                    <div class="w-20 h-20 rounded-full bg-amber-400/10 flex items-center justify-center mb-4 border border-amber-300/30 group-hover:scale-110 transition-transform duration-500 shadow-[0_0_20px_rgba(251,191,36,0.3)]">
                        <i class="fa-solid fa-horse text-4xl text-amber-300"></i>
                    </div>
                    <h3 class="text-amber-200 font-serif tracking-widest text-lg mb-1 font-semibold">UNICORN CARDS</h3>
                    <p class="text-xs text-indigo-300 tracking-wider">點擊抽取獨角獸指引</p>
                    <div class="mt-6 px-4 py-1.5 bg-amber-400/20 text-amber-200 text-xs rounded-full border border-amber-300/30 animate-bounce">
                        輕觸抽卡 ✨
                    </div>
                </div>

                <!-- Card Front (Revealed state) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-2xl border-2 border-amber-400/60 bg-slate-950 flex flex-col overflow-hidden shadow-2xl">
                    <div class="relative flex-1 bg-black/60 overflow-hidden flex items-center justify-center">
                        <img id="card-image" src="" alt="Card Image" class="w-full h-full object-cover" onerror="window.handleImageError(this)">
                        <!-- Fallback container if image fails -->
                        <div id="card-fallback" class="absolute inset-0 hidden flex flex-col items-center justify-center p-6 bg-gradient-to-br from-indigo-950 to-slate-900 text-center">
                            <i class="fa-solid fa-horse-head text-5xl text-amber-300 mb-3 opacity-80"></i>
                            <span id="fallback-card-num" class="text-amber-400 font-mono text-xs mb-1">#01</span>
                            <h4 id="fallback-card-name" class="text-amber-200 font-serif font-bold text-base mb-2">卡牌名稱</h4>
                            <p id="fallback-card-desc" class="text-indigo-200 text-xs italic whitespace-pre-line">指引說明</p>
                        </div>
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-full text-xs font-mono text-amber-300 border border-amber-400/30 shadow" id="card-number-badge">
                            #01
                        </div>
                    </div>
                    <div class="p-4 bg-gradient-to-t from-indigo-950 via-indigo-900/90 to-indigo-950/80 border-t border-white/10 text-center">
                        <h2 id="card-title" class="text-amber-200 font-serif font-bold text-lg mb-1">卡牌名稱</h2>
                        <p id="card-desc" class="text-indigo-200 text-xs italic whitespace-pre-line">卡牌短句或指引說明</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Action Controls -->
        <div class="flex space-x-4 w-full max-w-xs">
            <button onclick="drawCard()" id="draw-btn" class="flex-1 py-3.5 px-6 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2 active:scale-95">
                <i class="fa-solid fa-hand-sparkles"></i>
                <span>抽取卡片</span>
            </button>
            <button onclick="openGallery()" class="py-3.5 px-5 bg-white/10 hover:bg-white/20 text-indigo-100 font-medium rounded-xl border border-white/20 transition-all flex items-center justify-center space-x-1 active:scale-95">
                <i class="fa-solid fa-images text-amber-300"></i>
                <span>牌庫</span>
            </button>
        </div>

    </main>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex flex-col transition-opacity duration-300">
        <div class="p-4 flex justify-between items-center border-b border-white/10 bg-black/40">
            <div>
                <h2 class="text-lg font-serif font-bold text-amber-200">全部 44 張獨角獸卡牌</h2>
                <p class="text-xs text-indigo-300">已抽過: <span id="drawn-count">0</span> / 44</p>
            </div>
            <button onclick="closeGallery()" class="w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-all">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4">
            <div id="card-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-w-2xl mx-auto">
                <!-- Dynamically populated card items -->
            </div>
        </div>
        <div class="p-4 bg-black/40 border-t border-white/10 flex justify-center">
            <button onclick="closeGallery()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium shadow-lg transition-all">
                返回抽卡
            </button>
        </div>
    </div>

    <!-- Custom Modal (Replaces alert/confirm) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-indigo-950 border border-amber-400/40 rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl animate-scale-up">
            <div class="w-12 h-12 rounded-full bg-amber-400/20 text-amber-300 flex items-center justify-center mx-auto mb-4 border border-amber-300/30 text-xl">
                <i id="modal-icon" class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-serif font-bold text-amber-200 mb-2">提示</h3>
            <p id="modal-message" class="text-sm text-indigo-200 mb-6 leading-relaxed">訊息內容</p>
            <div id="modal-actions" class="flex space-x-3 justify-center">
                <button onclick="closeCustomModal()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition-all">確定</button>
            </div>
        </div>
    </div>

    <script>
        const totalCards = 44;
        let cards = [];
        let drawnCards = [];
        let currentCard = null;
        let isFlipped = false;
        let isAnimating = false;

        // Define image error fallback handler globally
        window.handleImageError = function(imgEl) {
            imgEl.style.display = 'none';
            const fallbackEl = document.getElementById('card-fallback');
            if (fallbackEl) {
                fallbackEl.classList.remove('hidden');
            }
        };

        // Initialize 44 cards dataset with names and descriptions
        function initCards() {
            cards = [];
            for (let i = 1; i <= totalCards; i++) {
                let name = `獨角獸卡 #${i}`;
                let desc = `探索內在力量與靈性指引`;
                
                if (i === 1) { name = "獨角獸之光"; desc = "保持純淨。\n連結你的守護天使。"; }
                else if (i === 2) { name = "純淨的意圖"; desc = "找到清明。\n放棄你的小我。"; }
                else if (i === 3) { name = "創造你的願景"; desc = "做會讓你的心歌唱之事。\n你被輕推著向前行。"; }
                else if (i === 4) { name = "解開關係的羈絆"; desc = "現在就放下。\n寬恕就是自由。"; }
                else if (i === 5) { name = "新的契機"; desc = "清理你的人生。\n瞥見一扇魔法之門。"; }
                else if (i === 6) { name = "進入魔法"; desc = "活在現在。\n抓住當下。"; }
                else if (i === 7) { name = "聆聽你的心"; desc = "喚醒心靈能力。\n調頻進入無限。"; }
                else if (i === 8) { name = "樂於接受豐盛"; desc = "相信你值得。\n接受豐富與繁榮。"; }
                else if (i === 9) { name = "敞開你的心"; desc = "愛自己。\n敢於脆弱易感。"; }
                else if (i === 10) { name = "取用你的天賦"; desc = "探索你的寶箱。\n接納你的真實本性。"; }
                else if (i === 11) { name = "尋找徵兆"; desc = "好好注意。\n期待答案。"; }

                let imgPath = `獨角獸${i}.jpg`;
                cards.push({
                    id: i,
                    name: name,
                    desc: desc,
                    image: imgPath
                });
            }
        }

        function loadState() {
            const savedDrawn = localStorage.getItem('unicorn_drawn_cards_v3');
            if (savedDrawn) {
                try {
                    drawnCards = JSON.parse(savedDrawn);
                } catch(e) {
                    drawnCards = [];
                }
            }
            updateCounterBadge();
        }

        function saveState() {
            localStorage.setItem('unicorn_drawn_cards_v3', JSON.stringify(drawnCards));
            updateCounterBadge();
        }

        function updateCounterBadge() {
            const remaining = totalCards - drawnCards.length;
            const badge = document.getElementById('counter-badge');
            if (badge) {
                badge.innerText = `${remaining} / ${totalCards}`;
            }
        }

        function showCustomModal(title, message, iconClass = "fa-circle-exclamation", callback = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').className = `fa-solid ${iconClass}`;
            
            const actionsDiv = document.getElementById('modal-actions');
            if (callback) {
                actionsDiv.innerHTML = `
                    <button onclick="closeCustomModal()" class="flex-1 py-2.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-sm font-medium transition-all">取消</button>
                    <button id="modal-confirm-btn" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm transition-all">確定</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => {
                    closeCustomModal();
                    callback();
                };
            } else {
                actionsDiv.innerHTML = `<button onclick="closeCustomModal()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition-all">確定</button>`;
            }
            
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        window.drawCard = function() {
            if (isAnimating) return;

            if (drawnCards.length >= totalCards) {
                showCustomModal("牌局已滿", "44 張獨角獸卡牌已經全部抽完囉！請點擊重新洗牌開始新的一局。", "fa-rotate-right", resetDeck);
                return;
            }

            const availableCards = cards.filter(c => !drawnCards.includes(c.id));
            if (availableCards.length === 0) return;

            const randomIndex = Math.floor(Math.random() * availableCards.length);
            const selectedCard = availableCards[randomIndex];
            currentCard = selectedCard;

            isAnimating = true;
            const cardInner = document.getElementById('card-inner');

            if (isFlipped) {
                cardInner.style.transform = 'rotateY(0deg)';
                isFlipped = false;
                setTimeout(() => {
                    setupCardFace(selectedCard);
                    flipCardShow(cardInner);
                }, 350);
            } else {
                setupCardFace(selectedCard);
                flipCardShow(cardInner);
            }

            drawnCards.push(selectedCard.id);
            saveState();
        };

        function setupCardFace(card) {
            const imgEl = document.getElementById('card-image');
            const fallbackEl = document.getElementById('card-fallback');
            
            imgEl.style.display = 'block';
            fallbackEl.classList.add('hidden');
            
            imgEl.src = card.image;
            document.getElementById('card-number-badge').innerText = `#${card.id}`;
            document.getElementById('card-title').innerText = card.name;
            document.getElementById('card-desc').innerText = card.desc;
            
            document.getElementById('fallback-card-num').innerText = `#${card.id}`;
            document.getElementById('fallback-card-name').innerText = card.name;
            document.getElementById('fallback-card-desc').innerText = card.desc;

            document.getElementById('status-message').innerText = `✨ 你抽到了第 ${card.id} 張卡牌：${card.name}`;
        }

        function flipCardShow(cardInner) {
            setTimeout(() => {
                cardInner.style.transform = 'rotateY(180deg)';
                isFlipped = true;
                isAnimating = false;
            }, 50);
        }

        window.confirmReset = function() {
            showCustomModal("重新洗牌", "確定要將所有已抽出的卡牌收回牌庫並重新洗牌嗎？", "fa-rotate", resetDeck);
        };

        function resetDeck() {
            drawnCards = [];
            saveState();
            
            const cardInner = document.getElementById('card-inner');
            cardInner.style.transform = 'rotateY(0deg)';
            isFlipped = false;
            document.getElementById('status-message').innerText = "已重新洗牌，請點擊牌背抽取今日指引";
        }

        window.openGallery = function() {
            const grid = document.getElementById('card-grid');
            grid.innerHTML = '';
            
            let drawnCount = drawnCards.length;
            document.getElementById('drawn-count').innerText = drawnCount;

            cards.forEach(card => {
                const isDrawn = drawnCards.includes(card.id);
                const cardEl = document.createElement('div');
                cardEl.className = `relative rounded-xl overflow-hidden border transition-all aspect-[2/3] flex flex-col items-center justify-center p-2 text-center shadow ${isDrawn ? 'bg-indigo-900/80 border-amber-400/60' : 'bg-slate-900/50 border-white/10 opacity-50'}`;
                
                cardEl.innerHTML = `
                    <div class="absolute top-1 left-1 bg-black/60 px-1.5 py-0.5 rounded text-[10px] font-mono text-amber-300">#${card.id}</div>
                    <div class="w-full flex-1 mb-1 rounded overflow-hidden bg-black/40 flex items-center justify-center relative">
                        <img src="${card.image}" class="w-full h-full object-cover ${isDrawn ? '' : 'filter grayscale'}" onerror="window.handleImageError(this)">
                        <div class="absolute inset-0 hidden flex-col items-center justify-center p-2 bg-indigo-950 text-center">
                            <i class="fa-solid fa-horse-head text-amber-300 text-xl mb-1"></i>
                            <span class="text-[10px] text-amber-200">${card.name}</span>
                        </div>
                    </div>
                    <span class="text-[11px] font-medium text-amber-100 truncate w-full">${isDrawn ? card.name : '未抽取'}</span>
                `;
                grid.appendChild(cardEl);
            });

            document.getElementById('gallery-modal').classList.remove('hidden');
        };

        window.closeGallery = function() {
            document.getElementById('gallery-modal').classList.add('hidden');
        };

        window.onload = function() {
            initCards();
            loadState();
        };
    </script>
</body>
</html>
